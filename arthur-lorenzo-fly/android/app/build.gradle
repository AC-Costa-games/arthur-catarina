plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arthurlorenzo.fly'
    compileSdk 34

    defaultConfig {
        applicationId 'com.arthurlorenzo.fly'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '4.0'
    }

    // assinatura fixa: cada APK novo instala por cima do anterior sem apagar estrelas e recordes
    signingConfigs {
        fixa {
            storeFile file('assinatura.p12')
            storeType 'pkcs12'
            storePassword 'arthurcatarina'
            keyAlias 'alfly'
            keyPassword 'arthurcatarina'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixa
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixa
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
